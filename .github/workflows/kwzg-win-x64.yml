name: Build Windows x64 (Unsigned)

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '可选覆盖构建版本号（如 0.2.2-rc.2.20261114.1）；留空使用 package.json 版本'
        type: string
        default: ''
        required: false
  push:
    branches:
      - kwzg-desktop
    paths:
      - '.github/workflows/kwzg-win-x64.yml'

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Developer Mode (symlink support)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
          $fs = (Get-Volume -DriveLetter $drive).FileSystem
          if ($fs -eq 'ReFS') {
            pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare unsigned Windows packaging config
        run: |
          @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            'DOWNLOAD_PROD_ORIGIN=https://r2.zhoumaosen.top'
            'DSH_DESKTOP_UPDATE_PREFIX=yizu/desktop'
            'DSH_DESKTOP_UPDATE_UNSIGNED=1'
            'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://kwzg.yizuw.cn'
            'DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3'
          ) | Set-Content -Path "apps/desktop/.env.windows" -Encoding utf8

      - name: Check Windows packaging toolchain
        env:
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $versionArgs = @()
          if ($env:INPUT_BUILD_VERSION -and $env:INPUT_BUILD_VERSION.Trim() -ne '') {
            $versionArgs += @('--build-version', $env:INPUT_BUILD_VERSION.Trim())
          }
          pnpm run package:desktop:win:x64:unsigned -- --check @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 unsigned installer
        env:
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $versionArgs = @()
          if ($env:INPUT_BUILD_VERSION -and $env:INPUT_BUILD_VERSION.Trim() -ne '') {
            $versionArgs += @('--build-version', $env:INPUT_BUILD_VERSION.Trim())
          }
          pnpm run package:desktop:win:x64:unsigned -- @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage (and upload if configured) R2 auto-update feed
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_REGION: ${{ vars.R2_REGION || 'auto' }}
        run: |
          $uploadArgs = @()
          if ($env:R2_ENDPOINT_URL -and $env:R2_BUCKET_NAME -and $env:R2_ACCESS_KEY_ID -and $env:R2_SECRET_ACCESS_KEY) {
            Write-Host "R2 credentials found; uploading feed & binaries directly to Cloudflare R2..."
            $uploadArgs += '--upload'
          } else {
            Write-Host "R2 credentials not configured in repository secrets; staging feed locally for workflow artifact only."
          }
          pnpm --dir apps/desktop exec tsx scripts/stage-r2-feed.ts win-x64 --unsigned @uploadArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize built Windows artifacts
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          Get-ChildItem -LiteralPath $outDir -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host ("{0}  size={1} bytes  sha256={2}" -f $_.Name, $_.Length, $hash)
          }

      - name: Upload Windows x64 installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kwzg-desktop-win-x64-unsigned
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.yml
            apps/desktop/.desktop-build/targets/win-x64/r2-stage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging diagnostics
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwzg-win-x64-packaging-logs
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
